[project]
name = "colab-persist"
version = "0.4.1"
description = "Verified Google Drive checkpoints for disposable Colab runtimes on the official Colab API, with a local MCP server and client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "google-auth>=2.40,<3", "requests>=2.32,<3", "websocket-client>=1.8,<2"]

[project.scripts]
colab-persist = "colab_persist.client:main"
colab-persist-mcp = "colab_persist.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["colab_persist"]
