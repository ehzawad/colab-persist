[project]
name = "colab-persist"
version = "0.1.0"
description = "Drive checkpoints for disposable Colab runtimes, with a local MCP server and client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "google-colab-cli==0.7.4"]

[project.scripts]
colab-persist = "colab_persist.client:main"
colab-persist-mcp = "colab_persist.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["colab_persist"]
